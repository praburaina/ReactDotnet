name: Hotel Booking CI Pipeline
 
# When should this workflow execute?
on:
  push:
    branches:
      - main
 
  pull_request:
    branches:
      - main
 
jobs:
 
  # Frontend build
  frontend-build:
    name: React Vite Build
    runs-on: ubuntu-latest
 
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
 
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Frontend/package-lock.json
 
      - name: Install dependencies
        working-directory: Frontend
        run: npm ci
 
      - name: Build React application
        working-directory: Frontend
        run: npm run build
 
  # Backend build
  backend-build:
    name: .NET API Build
    runs-on: ubuntu-latest
 
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
 
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
 
      - name: Restore dependencies
        run: dotnet restore Backend/AzureApp.csproj
 
      - name: Build .NET API
        run: dotnet build Backend/AzureApp.csproj --configuration Release --no-restore